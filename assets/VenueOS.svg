  <rect x="72" y="72" width="368" height="368" rx="64" fill="#222a3a"/>
  <rect x="112" y="112" width="128" height="128" rx="28" fill="#44d3c4"/>
  <rect x="272" y="112" width="128" height="128" rx="28" fill="#34605e"/>
  <rect x="112" y="272" width="128" height="128" rx="28" fill="#34605e"/>
  <rect x="272" y="272" width="128" height="128" rx="28" fill="#f5b041"/>
  <circle cx="368" cy="304" r="14" fill="#1a202e"/>
