<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    VenueOS plugin icon — source of truth for assets/icon-512.png and assets/icon-64.png.
    A tablet/app-launcher glyph: a 2x2 grid of app tiles inside a screen inside a chassis, with one tile
    picked out in an accent color to suggest a live, modular operations console — not any single module.
    Regenerate the PNGs from this file (or from scripts/render_icon.py, which draws the same geometry
    procedurally) if this design changes; keep both in sync.
  -->
